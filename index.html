<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caco na Sua Home</title>

<style>
body{
  font-family: Arial;
  margin:0;
  background:#f5f1ec;
}
.container{
  max-width:1000px;
  margin:auto;
  padding:20px;
}
.card{
  background:#fff;
  padding:15px;
  border-radius:15px;
  margin-bottom:15px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}
img{
  width:100%;
  border-radius:10px;
}
button{
  width:100%;
  padding:15px;
  border:none;
  border-radius:10px;
  background:#2b1f19;
  color:#fff;
  font-weight:bold;
  margin-top:10px;
}
input, select{
  width:100%;
  padding:10px;
  margin-top:5px;
  border-radius:8px;
  border:1px solid #ccc;
}
</style>
</head>

<body>

<div class="container">

<h1>Caco na Sua Home</h1>

<div class="card">
<img src="imagens/prato1.jpg">
<h2>Costela na Pressão</h2>
<p>R$ 50,00 por pessoa</p>
<button onclick="selecionar('Costela na Pressão',50)">Selecionar</button>
</div>

<div class="card">
<img src="imagens/prato2.jpg">
<h2>Bombom de Alcatra</h2>
<p>R$ 50,00 por pessoa</p>
<button onclick="selecionar('Bombom de Alcatra',50)">Selecionar</button>
</div>

<div class="card">
<h2>Montar Pedido</h2>

<label>Pessoas</label>
<input id="pessoas" type="number" value="2">

<label>Região</label>
<select id="regiao">
<option value="0">Zona Sul</option>
<option value="20">Centro (+20)</option>
<option value="30">Oeste (+30)</option>
</select>

<h3 id="total">Total: R$ 0</h3>

<div style="background:#fff3e6;padding:10px;border-radius:10px">
💰 Pix: 269.592.038-56
<br>
Pedido confirmado após pagamento do sinal
</div>

<button onclick="enviar()">Enviar no WhatsApp</button>

</div>

</div>

<script>
let prato = "";
let preco = 0;

function selecionar(nome,valor){
  prato = nome;
  preco = valor;
  calcular();
}

document.getElementById("pessoas").oninput = calcular;
document.getElementById("regiao").onchange = calcular;

function calcular(){
  let pessoas = document.getElementById("pessoas").value;
  let taxa = Number(document.getElementById("regiao").value);

  let total = (preco * pessoas) + taxa;

  document.getElementById("total").innerText = "Total: R$ " + total;
}

function enviar(){
  let pessoas = document.getElementById("pessoas").value;
  let total = document.getElementById("total").innerText;

  let msg = `Pedido:\nPrato: ${prato}\nPessoas: ${pessoas}\n${total}\nPix: 269.592.038-56`;

  window.location.href = "https://wa.me/5512992107776?text=" + encodeURIComponent(msg);
}
</script>

</body>
</html>
